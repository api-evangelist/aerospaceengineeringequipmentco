aid: aerospaceengineeringequipmentco
name: Aerospace Engineering Equipment
description: Aerospace Engineering Equipment (Suzhou) Co., Ltd. — trading as AEE — is a Chinese industrial
  equipment manufacturer founded in December 2011 that designs, builds and integrates friction stir welding
  (FSW) machines, automatic FSW production lines and FSW tooling. It is a wholly owned subsidiary of Shanghai
  Aerospace Equipment Manufacturing Factory (149 Factory) under the Eighth Academy of the China Aerospace
  Science and Technology Corporation (CASC), operating an R&D headquarters in Wuzhong District, Suzhou
  and a volume production base in Liyang across roughly 55,000 square metres. AEE supplies one-, two-
  and three-dimensional FSW equipment plus process services into aerospace and aviation, rail transit,
  marine and shipbuilding, new-energy automotive, nuclear, power electronics and marine engineering. AEE
  publishes no developer program, no API documentation and no machine-readable specification; the surfaces
  profiled here are the anonymously readable WordPress REST content APIs served from its English-language
  marketing site at a-fsw.com, documented by API Evangelist from the server's own route index and OPTIONS
  schema documents.
